stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - data/raw_data
  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
    - data/raw_data
    - src/data_preprocessing.py
    outs:
    - data/processed
  feature_processing:
    cmd: python src\feature_processing.py
    deps:
    - data/processed
    - src/feature_processing.py
    params:
    - feature_processing.max_features
    outs:
    - data/tokenised
  model_training:
    cmd: python src/model_training.py
    deps:
    - data/tokenised
    - src/model_training.py
    params:
    - model_training.n_estimators
    - model_training.random_state
    outs:
    - models/model.pkl
  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
    - models/model.pkl
    - src/model_evaluation.py
    metrics:
    - reports/metrics.json

params:
- dvclive/params.yaml
metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
